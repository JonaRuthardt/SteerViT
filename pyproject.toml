[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "steervit"
version = "0.1.0"
description = "Inference package for SteerViT"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Jona Ruthardt"},
  {name = "Manu Gaur"},
  {name = "Deva Ramanan"},
  {name = "Makarand Tapaswi"},
  {name = "Yuki M Asano"},
]
dependencies = [
  "torch==2.7.0",
  "torchvision==0.22.0",
  "torchmetrics==1.8.2",
  "open_clip_torch==2.31.0",
  "pytorch-lightning==2.5.6",
  "accelerate==1.8.1",
  "transformers==4.57.0",
  "datasets==3.2.0",
  "peft==0.14.0",
  "safetensors==0.4.5",
  "huggingface_hub==0.36.2",
  "hf_transfer==0.1.9",
  "hydra-core==1.3.2",
  "omegaconf==2.3.0",
  "lightning==2.5.6",
  "einops==0.8.1",
  "timm==1.0.11",
  "tqdm==4.66.6",
  "psutil==6.1.0",
  "loguru==0.7.3",
  "rich==13.9.3",
  "numpy==2.0.2",
  "scipy==1.14.1",
  "scikit-learn==1.7.2",
  "pandas==2.2.3",
  "pyarrow==18.1.0",
  "pillow==11.2.1",
  "opencv-python-headless==4.11.0.86",
  "albumentations==2.0.8",
  "wandb==0.22.3",
  "tensorboard==2.20.0",
  "matplotlib",
  "prettytable",
  "jupyter",
  "notebook",
  "ipykernel",
  "ipywidgets",
  "jupyterlab"
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]