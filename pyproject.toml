[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "steervit"
version = "0.1.0"
description = "Inference package for SteerViT"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Jona Ruthardt"},
  {name = "Manu Gaur"},
  {name = "Deva Ramanan"},
  {name = "Makarand Tapaswi"},
  {name = "Yuki M Asano"},
]
dependencies = [
  "torch>=2.7,<2.8",
  "torchvision>=0.22,<0.23",
  "torchmetrics>=1.8,<2",
  "open_clip_torch>=2.31,<4",
  "accelerate>=1.8,<2",
  "transformers>=4.57,<5",
  "datasets>=3.2,<5",
  "peft>=0.14,<1",
  "safetensors>=0.4.5,<1",
  "huggingface_hub>=0.36,<1",
  "hf_transfer>=0.1,<1",
  "hydra-core>=1.3,<2",
  "omegaconf>=2.3,<3",
  "einops>=0.8,<1",
  "timm>=1.0,<2",
  "tqdm>=4.66",
  "rich>=13,<15",
  "numpy>=2.0,<3",
  "scipy>=1.14,<2",
  "scikit-learn>=1.7,<2",
  "pandas>=2.2,<3",
  "pyarrow>=18,<22",
  "pillow>=11,<12",
  "matplotlib>=3.8",
  "jupyter",
  "notebook",
  "ipykernel",
  "ipywidgets",
  "jupyterlab",
  "umap-learn"
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]